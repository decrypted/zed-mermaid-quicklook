name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # The extension crate is a cdylib against Zed's WASM API and only builds for
      # wasm32-wasip2, so it is linted and built for that target rather than the host.
      - name: Clippy (language server)
        run: cargo clippy --package mermaid-quicklook-lsp --all-targets

      - name: Clippy (extension)
        run: cargo clippy --lib --target wasm32-wasip2

      - name: Test
        run: cargo test --package mermaid-quicklook-lsp

      - name: Build language server
        run: cargo build --package mermaid-quicklook-lsp --release

      - name: Build extension (WASM)
        run: cargo build --lib --target wasm32-wasip2 --release

  render:
    # Renders a real diagram through mmdc and the language server, so a break in the
    # Mermaid CLI or in the LSP wiring fails here rather than in someone's editor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which stops
      # Puppeteer's Chromium from starting its sandbox. Lift the restriction on the
      # runner rather than passing --no-sandbox to mmdc: that flag would disable the
      # sandbox for real users too, and this job exists to exercise the path they run.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Build language server
        run: cargo build --package mermaid-quicklook-lsp --release

      - name: Render a diagram end to end
        run: ./scripts/ci-render.sh
